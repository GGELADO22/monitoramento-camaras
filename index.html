<script>
        const USER = 'GGELADO';
        const KEY = 'aio_AEkP23ACmVQhWVqmGVixG05L0w8S';
        const FEED = 'temperatura';

        async function atualizarDados() {
            // A URL correta é esta abaixo, que busca o ÚLTIMO dado enviado (data/last)
            const url = `https://io.adafruit.com/api/v2/${USER}/feeds/${FEED}/data/last?x-aio-key=${KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // O Adafruit retorna o valor dentro de data.value
                const valor = parseFloat(data.value).toFixed(1);
                
                if (data.value !== undefined) {
                    document.getElementById('display-temp').innerText = valor + "°C";
                    document.getElementById('time').innerText = new Date(data.created_at).toLocaleTimeString();

                    // Lógica de cor do status
                    const statusBox = document.getElementById('status-box');
                    if (valor > 8) {
                        statusBox.innerText = "ALERTA: ALTA";
                        statusBox.className = "status erro";
                    } else {
                        statusBox.innerText = "STATUS: OK";
                        statusBox.className = "status ok";
                    }
                }

            } catch (error) {
                console.error("Erro ao buscar dados:", error);
                document.getElementById('display-temp').innerText = "Erro API";
            }
        }

        // Atualiza a cada 5 segundos
        setInterval(atualizarDados, 5000);
        atualizarDados(); 
    </script>
