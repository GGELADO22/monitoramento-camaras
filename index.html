<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento de Câmaras Frias</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; }
        h1 { color: #333; margin-bottom: 30px; }
        .temp { font-size: 64px; font-weight: bold; color: #007bff; margin: 20px 0; }
        .status { padding: 10px 20px; border-radius: 8px; color: white; font-weight: bold; font-size: 1.2em; display: block; margin-bottom: 15px; min-height: 25px; }
        .ok { background: #28a745; }
        .erro { background: #dc3545; }
        p { color: #666; font-size: 0.9em; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Painel de Controle - Refrigeração</h1>
    
    <div class="card">
        <h2>Câmara 01</h2>
        <div id="display-temp" class="temp">--°C</div>
        
        <div id="status-box" class="status">Iniciando...</div>
        
        <p style="margin-top: 20px;">Última leitura do sensor:<br><span id="time">--:--:--</span></p>
    </div>

    <script>
        const USER = 'GGELADO'; 
        const p1 = 'aio_ZMfK26';
        const p2 = 'W9UNNiTSwO3iXLUa6arZn8';
        const KEY = p1 + p2;
        const FEED = 'temperatura';

        async function atualizarDados() {
            const url = `https://io.adafruit.com/api/v2/${USER}/feeds/${FEED}/data/last?x-aio-key=${KEY}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Erro na API');

                const data = await response.json();
                
                if (data && data.value !== undefined) {
                    const valor = parseFloat(data.value).toFixed(1);
                    document.getElementById('display-temp').innerText = valor + "°C";
                    
                    const dataLeitura = new Date(data.created_at);
                    document.getElementById('time').innerText = dataLeitura.toLocaleTimeString('pt-BR');

                    const statusBox = document.getElementById('status-box');
                    if (valor > 8) {
                        statusBox.innerText = "ALERTA: TEMPERATURA ALTA";
                        statusBox.className = "status erro";
                    } else {
                        statusBox.innerText = "STATUS: OPERAÇÃO OK";
                        statusBox.className = "status ok";
                    }
                }
            } catch (error) {
                console.error(error);
                document.getElementById('display-temp').innerText = "OFFLINE";
                const sb = document.getElementById('status-box');
                sb.innerText = "Erro de Conexão";
                sb.className = "status erro";
            }
        }

        setInterval(atualizarDados, 5000);
        atualizarDados();
    </script>
</body>
</html>
